<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="ins.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="https://www.pngkey.com/png/full/28-287308_instagram-logo-text-white.png" alt="Instagram">
        </div>
        
        <nav class="sidebar-menu">
            <a href="#" class="menu-item active"><i class="Casasiendounacasa"></i> <span>Inicio</span></a>
            <a href="#" class="menu-item"><i class="buscandoloquenosemehaperdido"></i> <span>Buscar</span></a>
            <a href="#" class="menu-item"><i class="explorandoloqueseexplora"></i> <span>Explorar</span></a>
            <a href="#" class="menu-item"><i class="videoscuestionabkes"></i> <span>Reels</span></a>
            <a href="#" class="menu-item"><i class="mensajesquesemandaporquesonmensajes"></i> <span>Mensajes</span></a>
            <a href="#" class="menu-item"><i class="notifdicandolanotificacion"></i> <span>Notificaciones</span></a>
            <a href="#" class="menu-item"><i class="crearcreacionesnocreadas"></i> <span>Crear</span></a>
            <a href="#" class="perfil">
                <img src="nigga.jpeg" alt="foto"> <span>Perfil</span>
            </a>
        </nav>

        <div class="sidebar-more">
            <a href="#" class="menu-item"><i class="fa-solid fa-bars"></i> <span>Más</span></a>
        </div>
    </aside>

    <main class="main-content">
        <div class="feed-container">
            
            <section class="stories">
                <div class="story-item">
                    <div class="story-ring"><img src="https://unavatar.io/twitter/nasa"></div>
                    <span>nasa</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="https://unavatar.io/github/apple"></div>
                    <span>apple</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="https://unavatar.io/google"></div>
                    <span>google</span>
                </div>
            </section>

            <article class="post">
                <div class="post-header">
                    <div class="post-user">
                        <img src="https://unavatar.io/twitter/nasa" alt="">
                        <span class="username">nasa</span> • <span class="time">12h</span>
                    </div>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <div class="post-media">
                    <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=800&q=80" alt="Space">
                </div>
                <div class="post-footer">
                    <div class="post-actions">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>
                        <i class="fa-regular fa-bookmark"></i>
                    </div>
                    <div class="likes">658,231 Me gusta</div>
                    <div class="caption">
                        <span class="username">nasa</span> Estado cero
                    </div>
                </div>
            </article>

        </div>

        <section class="suggestions">
            <div class="user-profile-side">
                <img src="https://unavatar.io/github/mdo" alt="">
                <div class="user-names">
                    <span class="username">Thecrazyhair</span>
                    <span class="full-name">dan</span>
                </div>
                <a href="#" class="switch-btn">Cambiar</a>
            </div>

            <div class="suggestions-header">
                <span>Sugerencias para ti</span>
                <a href="#">Ver todo</a>
            </div>

            <div class="suggestion-item">
                <img src="https://unavatar.io/github/facebook" alt="">
                <div class="user-names">
                    <span class="username">facebook</span>
                    <span class="sub">Sugerencia para ti</span>
                </div>
                <a href="#" class="follow-btn">Seguir</a>
            </div>
        </section>
    </main>

</body>
</html>
